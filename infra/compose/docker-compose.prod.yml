services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - annexevoice_caddy_data:/data
      - annexevoice_caddy_config:/config
      - /opt/annexevoice/web/dist:/srv/web:ro
      - /opt/annexevoice/admin/dist:/srv/admin:ro
    depends_on:
      - api

  api:
    image: ${REGION}-docker.pkg.dev/${PROJECT}/annexevoice/api:${IMAGE_TAG}
    restart: unless-stopped
    env_file: /opt/annexevoice/.env.prod
    depends_on:
      - postgres
      - redis
    read_only: true
    tmpfs:
      - /tmp
    user: '10001:10001'

  worker:
    image: ${REGION}-docker.pkg.dev/${PROJECT}/annexevoice/worker:${IMAGE_TAG}
    restart: unless-stopped
    env_file: /opt/annexevoice/.env.prod
    depends_on:
      - postgres
      - redis
    user: '10001:10001'

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - /mnt/data/postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - /mnt/data/redis:/data

volumes:
  annexevoice_caddy_data:
  annexevoice_caddy_config:
