name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: annexevoice
          POSTGRES_PASSWORD: annexevoice
          POSTGRES_DB: annexevoice
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter @annexevoice/api exec prisma generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          DATABASE_URL: postgresql://annexevoice:annexevoice@localhost:5432/annexevoice
          REDIS_URL: redis://localhost:6379

  openapi-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter @annexevoice/api build
      - name: Boot API, regenerate client, diff
        run: |
          pnpm --filter @annexevoice/api start:prod &
          API_PID=$!
          sleep 8
          pnpm api:generate || true
          kill "$API_PID"
          if ! git diff --exit-code packages/api-client/src/generated; then
            echo "OpenAPI client drift detected. Run 'pnpm api:generate' and commit."
            exit 1
          fi
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://annexevoice:annexevoice@localhost:5432/annexevoice
          REDIS_URL: redis://localhost:6379
